<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased relative overflow-hidden">
<!-- Luxury Background Element -->
<div class="absolute inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-b from-[#0F0C1A]/60 via-[#1A1333]/80 to-[#0F0C1A] z-10 mix-blend-multiply"></div>
<img alt="Luxury background abstract" class="w-full h-full object-cover opacity-40" data-alt="Abstract dark luxury texture with subtle deep purple and dark silver fluid waves, moody dramatic studio lighting, 8k resolution" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPDZ3rkVHylWTPeYYHcHetUCiawDuhlBOJGoM4d95PlJXL3ZJYhB68iYdsybOysBoVRmzcw6HGwl-OA7EsDRg6lxzh-vjdHJsJWNoACsl174Q2uGBsI8M4q7pk_Y_SDJJCRFX6QoPweD8dLfGSoKj2xKhg3ZNrSyxIeVXBNSD_7p3i2wKAf6T3uKBfRnFL1zPYh3vrqGmRY3bTWF9hM3iI4ZnIxQEzdteYYzxR1LwJgpXogkCqs8mOvme0EWht6XQjl4aZ3DXKcC8U"/>
<!-- Subtle Glow Effects -->
<div class="absolute top-1/4 left-1/4 w-[500px] h-[500px] bg-primary-container/20 rounded-full blur-[120px] mix-blend-screen pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-[400px] h-[400px] bg-secondary/10 rounded-full blur-[100px] mix-blend-screen pointer-events-none"></div>
</div>
<!-- Main Content Canvas (No Nav Shells for Transactional Page) -->
<main class="flex-1 relative z-10 flex flex-col items-center justify-center p-margin-mobile">
<!-- Brand Header (Floating) -->
<div class="mb-lg text-center">
<h1 class="text-display font-display tracking-tighter uppercase text-white drop-shadow-[0_0_15px_rgba(255,255,255,0.2)]">Fuuk'Up</h1>
</div>
<!-- Authentication Card (Glassmorphism) -->
<div class="w-full max-w-sm bg-surface-container-low/60 backdrop-blur-2xl border border-white/5 rounded-xl p-md shadow-[0_20px_40px_rgba(0,0,0,0.5)]">
<div class="flex items-center justify-between mb-lg">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center p-xs">
<span aria-hidden="true" class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex space-x-2">
<div class="w-2 h-2 rounded-full bg-surface-variant"></div>
<div class="w-2 h-2 rounded-full bg-primary shadow-[0_0_8px_rgba(198,191,255,0.6)]"></div>
</div>
</div>
<div class="mb-lg">
<h2 class="text-headline-md font-headline-md mb-xs text-on-surface">Verification</h2>
<p class="text-body-md font-body-md text-on-surface-variant">
                    Enter the 4-digit code sent to <br/>
<span class="text-on-surface font-semibold">+1 (555) 019-2834</span>
</p>
</div>
<!-- OTP Input Fields -->
<div class="flex justify-between gap-sm mb-lg">
<input aria-label="Digit 1" class="w-14 h-16 bg-surface-container/50 border-b-2 border-inverse-primary text-center text-headline-lg font-headline-lg text-on-surface rounded-t-DEFAULT focus:outline-none focus:border-primary focus:bg-surface-container-high transition-all" maxlength="1" type="text" value="8"/>
<input aria-label="Digit 2" class="w-14 h-16 bg-surface-container/50 border-b-2 border-inverse-primary text-center text-headline-lg font-headline-lg text-on-surface rounded-t-DEFAULT focus:outline-none focus:border-primary focus:bg-surface-container-high transition-all" maxlength="1" type="text" value="0"/>
<input aria-label="Digit 3" autofocus="" class="w-14 h-16 bg-surface-container/50 border-b-2 border-inverse-primary text-center text-headline-lg font-headline-lg text-on-surface rounded-t-DEFAULT focus:outline-none focus:border-primary focus:bg-surface-container-high transition-all focus:shadow-[0_4px_15px_rgba(88,71,210,0.3)]" maxlength="1" type="text" value=""/>
<input aria-label="Digit 4" class="w-14 h-16 bg-surface-container/50 border-b-2 border-inverse-primary text-center text-headline-lg font-headline-lg text-on-surface rounded-t-DEFAULT focus:outline-none focus:border-primary focus:bg-surface-container-high transition-all" maxlength="1" type="text" value=""/>
</div>
<!-- Timer / Resend -->
<div class="flex justify-center items-center mb-lg">
<span aria-hidden="true" class="material-symbols-outlined text-secondary mr-xs text-[18px]">timer</span>
<span class="text-body-md font-body-md text-secondary">01:45</span>
</div>
<!-- Gold Verify Button -->
<button class="w-full bg-secondary text-on-secondary font-label-caps text-label-caps py-4 rounded-full tracking-widest shadow-[0_0_20px_rgba(244,190,78,0.25)] hover:bg-secondary-fixed hover:scale-[0.98] active:scale-95 transition-all duration-200">
                VERIFY
            </button>
<div class="mt-md text-center">
<button class="text-body-md font-body-md text-on-surface-variant hover:text-on-surface transition-colors">
                    Didn't receive a code? <span class="text-primary underline decoration-primary/50 underline-offset-4">Resend</span>
</button>
</div>
</div>
