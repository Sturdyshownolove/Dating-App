<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

                        "surface": "#13121b",

<style>
        body { background-color: theme('colors.background'); }
        .glass-panel {
            background: rgba(42, 41, 50, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .glow-primary {
            box-shadow: 0 0 24px rgba(108, 92, 231, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 border-b border-white/10 bg-[#0F0C1A]/80 backdrop-blur-xl shadow-[0_4px_30px_rgba(0,0,0,0.1)] flex justify-between items-center h-16 px-5">
<button class="text-white/60 hover:text-[#6C5CE7] transition-colors active:scale-95 duration-200 flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="text-xl font-black text-white tracking-tighter uppercase font-['Plus_Jakarta_Sans'] font-bold tracking-tight text-[#6C5CE7]">
            Fuuk’Up
        </div>
<button class="text-white/60 hover:text-[#6C5CE7] transition-colors active:scale-95 duration-200 flex items-center justify-center">
<span class="material-symbols-outlined">schedule</span>
</button>
</nav>
<!-- Main Content Canvas -->
<main class="flex-1 pt-[88px] pb-lg px-margin-mobile max-w-md mx-auto w-full flex flex-col gap-md">
<!-- Header -->
<header class="mb-base">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-xs">Curate Your Vibe</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Upload high-fidelity visuals to complete your dossier.</p>
</header>
<!-- Photo Grid (Bento Layout) -->
<section aria-label="Photo Uploads" class="grid grid-cols-3 gap-base">
<!-- Main Hero Slot -->
<div class="col-span-2 row-span-2 aspect-[4/5] rounded-xl overflow-hidden relative glass-panel flex items-center justify-center group cursor-pointer">
<img alt="Main Profile Photo" class="absolute inset-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" data-alt="dramatic portrait of a confident young person in moody neon lighting against a dark textured background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHxZW17v4-aqSV3YGW_q3KnpsdlRAywNpR7d0wIr_idDjDAiDMQuquAwCyuTldAfo-bVaEzxzUBr929D4e-uhAZbNvG5OvBXedDmtPEWirjpV_tfWT8OsB6-dhrYFbJAArEsBisZQHlZDkLRN24tCYFD9ZBg9zAba6W6vPB3UwakARsZdjPYQkXRwM7CjhuY38uZ5TSPnpWexdTP6T092GMbrzwvGWxjpHepBCQxdGQ7bJmoWhZr4GlKXOc9JuT5xlP3kRve7Lhyak"/>
<div class="absolute inset-0 bg-gradient-to-t from-background/80 to-transparent"></div>
<div class="absolute bottom-sm right-sm bg-primary-container/90 backdrop-blur text-on-primary-container rounded-full p-2 flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_photo_alternate</span>
</div>
</div>
<!-- Secondary Slots -->
<div class="aspect-square rounded-xl glass-panel flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container hover:border-primary-container/50 transition-all cursor-pointer">
<span class="material-symbols-outlined mb-1">add</span>
</div>
<div class="aspect-square rounded-xl glass-panel flex flex-col items-center justify-center text-on-surface-variant hover:text-primary-container hover:border-primary-container/50 transition-all cursor-pointer">
<span class="material-symbols-outlined mb-1">add</span>
</div>
</section>
<!-- Bio Input -->
<section class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2" for="bio">
<span class="material-symbols-outlined text-[16px]">edit_note</span> The Narrative
            </label>
<div class="glass-panel rounded-lg p-[1px] focus-within:bg-gradient-to-r focus-within:from-primary-container focus-within:to-secondary-container transition-all duration-300">
<textarea class="w-full bg-surface-container-high rounded-lg p-sm font-body-md text-body-md text-on-background placeholder:text-on-surface-variant/50 border-none focus:ring-0 resize-none" id="bio" placeholder="Define your presence... (No external links)" rows="3"></textarea>
</div>
</section>
<!-- Interests Tags -->
<section class="flex flex-col gap-base">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]">local_fire_department</span> Interests
            </label>
<div class="flex flex-wrap gap-base">
<button class="px-sm py-[6px] rounded-full border border-primary-container bg-primary-container/10 text-primary-container font-label-caps text-label-caps transition-colors">Mixology</button>
<button class="px-sm py-[6px] rounded-full border border-white/10 bg-surface-container text-on-surface-variant font-label-caps text-label-caps hover:border-white/30 transition-colors">Contemporary Art</button>
<button class="px-sm py-[6px] rounded-full border border-primary-container bg-primary-container/10 text-primary-container font-label-caps text-label-caps transition-colors">Horology</button>
<button class="px-sm py-[6px] rounded-full border border-white/10 bg-surface-container text-on-surface-variant font-label-caps text-label-caps hover:border-white/30 transition-colors">Oenophile</button>
<button class="px-sm py-[6px] rounded-full border border-white/10 bg-surface-container text-on-surface-variant font-label-caps text-label-caps hover:border-white/30 transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">add</span> More
                </button>
</div>
</section>
<!-- Preferences (Distance) -->
<section class="flex flex-col gap-base pt-sm border-t border-white/5">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface-variant">Radius</label>
<span class="font-body-md text-body-md text-primary-container">15 mi</span>
</div>
<!-- Custom stylized slider track -->
<div class="w-full h-2 bg-surface-container-highest rounded-full relative overflow-hidden mt-xs">
<div class="absolute top-0 left-0 h-full bg-primary-container w-[40%] rounded-full shadow-[0_0_10px_rgba(108,92,231,0.5)]"></div>
</div>
</section>
<!-- Action Area -->
<div class="mt-md pb-md">
<button class="w-full bg-primary-container text-on-primary-container py-sm rounded-lg font-headline-md text-headline-md flex justify-center items-center gap-xs glow-primary active:scale-95 transition-transform duration-200">
                Finalize Entry
                <span class="material-symbols-outlined text-[20px]">check_circle</span>
</button>
</div>
</main>
</body></html>
